[project]
name = "gcp-llm-api"
version = "0.1.0"
description = "FastAPI service that calls Gemini, deployed on Cloud Run"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "google-genai>=1.0,<2.0",
    "pydantic-settings>=2.4,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
# An application, not a library: install dependencies only.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
